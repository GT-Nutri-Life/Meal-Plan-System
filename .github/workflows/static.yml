# Verify the portal, then deploy it and every bundled subsystem to Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every bundled page carries the switcher
        run: scripts/inject-nav.sh --check

      - name: Every bundled page is on the pastel palette
        run: scripts/recolor-apps.js --check

      - name: Registry, adapters and data flow agree with what is on disk
        run: scripts/verify-registry.js

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: "Browser suites: portal, switcher, sign-in and cross-system handoff"
        run: node tests/run.js

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
